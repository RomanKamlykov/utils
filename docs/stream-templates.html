<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Templates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.1/dist/js-yaml.min.js"></script>
</head>
<body>

<nav class="navbar bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="/utils">Utils</a>
    </div>
</nav>

<div class="container">
    <div id="app">
        <h3>Stream Templates</h3>

        <div>
            <div class="mb-3">
                <label for="inputText" class="form-label">Form link names</label>
                <textarea id="inputText" class="form-control" :rows="rows" v-model="text"></textarea>
            </div>
            <div class="mb-3">
                <label for="inputFile" class="btn btn-primary">Select YAML</label>
                <input type="file" id="inputFile" class="d-none" accept=".yaml,.yml" @change="onFileChange" />
            </div>
        </div>
    </div>
</div>

<script>
const {computed, createApp, ref} = Vue;

createApp({
	setup() {
        // form link names
        const rawText = ref('');
        const text = computed({
            get() {
                return rawText.value
            },
            set(val) {
                rawText.value = val.replace(/[\r\n]+/g, '\n');
            },
        });
        const rows = computed(() => {
            return Math.min(Math.max(text.value.split('\n').length, 5), 20);
        });
        const formLinkNames = computed(() => {
            let lines = text.value.split('\n').map(line => line.trim()).filter(Boolean);
            lines = Array.from(new Set(lines));
            lines.sort();
            return lines;
        });

        // file
        function getUnixTime(date = new Date()) {
            return Math.trunc(date.getTime() / 1000);
        }
        function onFileChange(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onerror = () => {
                console.error('FileReader error:', reader.error);
            };
            reader.onload = () => {
                const string = String(reader.result ?? '');
                console.log('FileReader filename:', file.name);

                try {
                    const object = jsyaml.load(string);
                    console.log('JS-YAML parsed object:', object);

                    updateObject(object);

                    const content = jsyaml.dump(object);
                    const filename = getUnixTime() + '-' + file.name;
                    const contentType = 'text/plain;charset=us-ascii';
                    onFileDumped(content, filename, contentType);
                } catch (e) {
                    console.error('JS-YAML parsing error:', e);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }
        function updateObject(object) {
            const names = formLinkNames.value.map(name => {
                return {formLinkName: name, streamName: `_${name}`}
            });
            const streamNames = names.map(name => name.streamName);
            // check
            object.check.stream_names = streamNames;
            // metadata
            object.metadata.autoImportSchema = Object.fromEntries(streamNames.map(name => [name, true]));
            object.metadata.testedStreams = {};
            // streams
            const [templateStream] = object.streams;
            object.streams = names.map(({formLinkName, streamName}) => {
                return {
                    ...templateStream,
                    // incremental_sync
                    name: streamName,
                    // primary_key
                    retriever: {
                        ...templateStream.retriever,
                        requester: {
                            ...templateStream.retriever.requester,
                            url: `https://people.zoho.eu/people/api/forms/${formLinkName}/getRecords`
                        },
                    },
                    schema_loader: {
                        ...templateStream.schema_loader,
                        schema: {
                            ...templateStream.schema_loader.schema,
                            properties: {Zoho_ID: {type: 'number'}, ModifiedTime: {type: 'string'}},
                            required: ['Zoho_ID', 'ModifiedTime'],
                        },
                    },
                    // type
                };
            });
        }
        function onFileDumped(content, filename, contentType) {
            const blob = new Blob([content], {type: contentType });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }
        return {text, rows, formLinkNames, onFileChange};
	}
}).mount('#app');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
