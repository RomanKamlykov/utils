<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome headers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

<nav class="navbar bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="/utils">Utils</a>
    </div>
</nav>

<div class="container">
    <div id="app">
        <h3>Chrome headers</h3>

        <div>
            <div class="mb-3">
                <label for="inputText" class="form-label">Text</label>
                <textarea id="inputText" class="form-control" :rows="rows" v-model="text"></textarea>
            </div>
        </div>
        <pre>{{ result }}</pre>
    </div>
</div>

<script>
const {computed, createApp, ref} = Vue;

function chunk(array, size = 1) {
    const result = [];
    for (let i = 0; i < array.length; i += size) {
        result.push(array.slice(i, i + size));
    }
    return result;
}

function upperFirst(str)  {
    return str.charAt(0).toUpperCase() + str.slice(1);
}

function stringifyValue(obj) {
    let result = '';
    result += '{\n';
    for (const key in obj) {
        const header = key.split('-').map(upperFirst).join('-');
        const value = obj[key];
        result += `    '${header}': '${value}',\n`;
    }
    result += '}';
    return result;
}

createApp({
    setup() {
        const text = ref('');
        const rows = computed(() => {
            return Math.min(Math.max(text.value.split('\n').length, 5), 20);
        });
        const result = computed(() => {
            if (!text.value) {
                return '';
            }
            let result = '';
            try {
                const lines = text.value.split('\n');
                const entries = chunk(lines, 2);
                result += stringifyValue(Object.fromEntries(entries));
            } catch {}
            return result;
        });
        return {text, rows, result};
    }
}).mount('#app');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
