<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

<nav class="navbar bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="/utils">Utils</a>
    </div>
</nav>

<div class="container">
    <div id="app">
        <h3>Text to Table</h3>

        <div class="mb-3">
            <a href="https://ozh.github.io/ascii-tables" target="_blank" rel="noopener noreferrer">source</a>
        </div>

        <div>
            <div class="mb-3">
                <label for="inputText" class="form-label">Text</label>
                <textarea id="inputText" class="form-control" :rows="rows" v-model="text"></textarea>
            </div>
            <div class="mb-3">
                <label for="inputDelimiter" class="form-label">Delimiter</label>
                <select id="inputDelimiter" class="form-select" v-model="delimiter">
                    <option v-for="el in delimiters" :value="el.value">{{ el.label }}</option>
                </select>
            </div>
            <div class="mb-3" v-if="delimiter === '\n'">
                <label for="inputColumns" class="form-label">Columns</label>
                <input type="text" id="inputColumns" class="form-control" v-model="columns">
            </div>
            <div class="mb-3">
                <label for="inputStyle" class="form-label">Style</label>
                <select id="inputStyle" class="form-select" v-model="style">
                    <option v-for="el in styles" :value="el.value">{{ el.label }}</option>
                </select>
            </div>
            <div class="form-check" v-if="style === '|'">
                <input type="checkbox" id="inputHeader" class="form-check-input" v-model="header">
                <label for="inputHeader" class="form-check-label">Header</label>
            </div>
        </div>
        <pre>{{ result }}</pre>
    </div>
</div>

<script>
const {computed, createApp, ref} = Vue;

function chunk(array, size = 1) {
    const result = [];
    for (let i = 0; i < array.length; i += size) {
        result.push(array.slice(i, i + size));
    }
    return result;
}

function parseInput(text, delimiter, columns) {
    const lines = text.split('\n');
    switch (delimiter) {
        case 'md':
            return lines
                .filter(line => line.includes('|'))
                .map(line => {
                    const parts = line.split('|');
                    // Remove leading/trailing empty elements from outer pipes
                    if (parts[0].trim() === '') parts.shift();
                    if (parts.length > 0 && parts[parts.length - 1].trim() === '') parts.pop();
                    return parts.map(cell => cell.trim());
                })
                // Filter out separator rows (e.g., | --- | --- |)
                .filter(row => !row.every(cell => cell.match(/^[:\-\s]+$/) && cell.includes('-')));
        case '\n':
            return chunk(lines.filter(line => line.trim()), +columns);
        default:
            return lines.map(line => line.split(delimiter));
    }
}

function formatTable(rows, style, header) {
    let result = '';
    // TSV & CSV
    if (style === '\t' || style === ',') {
        return rows.map(row => {
            return row.map(cell => {
                return style === ',' && cell.includes(',') ? `"${cell}"` : cell;
            }).join(style);
        }).join('\n');
    }

    // ASCII & Markdown
    const width = [];
    rows.forEach(row => {
        row.forEach((cell, i) => {
            width[i] = Math.max(cell.length, width[i] || 1);
        });
    });

    const border = style === '|' || style === '/*'
        // ASCII
        ? width.map(w => '+'.padEnd(w + 3, '-')).join('') + '+'
        // Markdown
        : width.map(w => '|'.padEnd(w + 3, '-')).join('') + '|';

    // ASCII border top
    if (style === '|' || style === '/*') {
        result += border + '\n';
    }
    rows.forEach((row, i) => {
        row.forEach((cell, i) => {
            result += `| ${cell.padEnd(width[i])} `;
        });
        result += '|\n';
        if (header && i === 0) {
            result += border + '\n';
        }
    });
    // ASCII border bottom
    if (style === '|' || style === '/*') {
        result += border;
    }
    // ASCII comment
    if (style === '/*') {
        result = '/*' + result.slice(2, -2) + '*/';
    }

    return result;
}

createApp({
	setup() {
        const rawText = ref('');
        const text = computed({
            get() {
                return rawText.value
            },
            set(val) {
                rawText.value = val.replace(/[\r\n]+/g, '\n');
            },
        });
        const rows = computed(() => {
            return Math.min(Math.max(text.value.split('\n').length, 5), 20);
        });
        const delimiters = [
            {label: 'tab', value: '\t'},
            {label: 'comma', value: ','},
            {label: 'newline', value: '\n'},
            {label: 'Markdown', value: 'md'},
        ];
        const delimiter = ref(delimiters[0].value);
        const columns = ref('2');
        const styles = [
            {label: 'ASCII', value: '|'},
            {label: 'ASCII comment', value: '/*'},
            {label: 'Markdown', value: 'm'},
            {label: 'TSV', value: '\t'},
            {label: 'CSV', value: ','},
        ];
        const style = ref(styles[0].value);
        const header = ref(true);
        const result = computed(() => {
            if (!text.value) {
                return '';
            }

            const rows = parseInput(text.value, delimiter.value, columns.value);
            return formatTable(rows, style.value, header.value);
        });
        return {text, rows, delimiters, delimiter, styles, style, columns, header, result};
	}
}).mount('#app');
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
